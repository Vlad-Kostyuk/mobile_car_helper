name: car_helper
description: Car maintenance tracking app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_bloc: ^9.1.1

  # Code generation annotations
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # DI
  get_it: ^8.0.3
  injectable: ^2.5.0

  # Navigation
  go_router: ^14.6.3

  # Local DB
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.1

  # Network
  dio: ^5.8.0
  connectivity_plus: ^6.1.1

  # Secure storage
  flutter_secure_storage: ^9.2.4

  # Auth
  google_sign_in: ^6.2.2
  supabase_flutter: ^2.8.4

  # Push notifications
  firebase_core: ^3.9.0
  firebase_messaging: ^15.2.4
  flutter_local_notifications: ^18.0.1

  # Calendar
  table_calendar: ^3.1.3

  # Images
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1

  # Fonts
  google_fonts: ^6.2.1

  # Utils
  intl: ^0.20.2
  shared_preferences: ^2.3.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code generation
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  injectable_generator: ^2.5.0
  drift_dev: ^2.22.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  generate: true
